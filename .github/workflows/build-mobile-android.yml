name: Build mobile Android app

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Typecheck mobile app
        run: npx tsc --noEmit

      - name: Build signed preview APK
        id: build
        run: |
          npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --json > build-result.json
          node -e "const fs = require('fs'); const result = JSON.parse(fs.readFileSync('build-result.json', 'utf8')); const build = Array.isArray(result) ? result[0] : result; if (!build?.id) throw new Error('EAS did not return a build ID'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'build_id=' + build.id + '\n');"

      - name: Download APK
        run: |
          npx eas-cli@latest build:download --build-id "${{ steps.build.outputs.build_id }}" --non-interactive
          apk=$(find . -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          mv "$apk" riyon-vehicle-management.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: riyon-vehicle-management-android
          path: mobile/riyon-vehicle-management.apk
          if-no-files-found: error
          retention-days: 30
